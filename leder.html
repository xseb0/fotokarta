  <h1>Leder på Madeira</h1>
  <p class="lead" id="lead">Vandringar valda och sorterade efter din stil: dimskog, vattenfall i mörk sten och platser där en figur får plats. Öppna en led för rutt, höjdprofil, väder timme för timme och fotopunkter.</p>
  <div class="ctl">
    <div class="seg" id="day"><button data-v="0">Idag</button><button data-v="1">I morgon</button><button data-v="2">Övermorgon</button></div>
    <div class="seg" id="sort"><button data-v="best">Bäst för dig</button><button data-v="wx">Bäst väder</button><button data-v="short">Kortast</button><button data-v="flat">Minst stigning</button></div>
    <div class="seg" id="len"><button data-v="any">Alla längder</button><button data-v="3">Upp till 3 km</button><button data-v="6">3 till 6 km</button><button data-v="99">Över 6 km</button></div>
    <div class="chips" id="chips"></div>
    <label class="ck"><input type="checkbox" id="showClosed"> Visa stängda leder</label>
  </div>
  <p class="small" id="wxMsg">Hämtar prognos …</p>
</header>

<main class="tlist" id="list" aria-live="polite"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Bild i större format" hidden>
  <div class="lbstage"><img id="lbImg" alt=""></div>
  <button class="lbbtn lbclose" id="lbClose" aria-label="Stäng">×</button>

  <button class="lbbtn lbnext" id="lbNext" aria-label="Nästa bild">›</button>
  <p class="lbcap" id="lbCap"></p>
</div>
